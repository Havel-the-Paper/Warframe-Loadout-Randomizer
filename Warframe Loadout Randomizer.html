Family":"Nezha","category":"Warframe","type":"Warframe","description":"The mercurial firemonger protects the innocent. Nezha’s multifaceted tactics give him high survivability as he inflicts damage and provides crowd control. His fire is the clarion of hope.","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Nezha","imageUrl":"https://cdn.warframestat.us/img/Nezha.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["vazarin","madurai"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"Slide |SPEED|% faster and go |RANGE|% farther."},{"name":"Nidus","baseFamily":"Nidus","category":"Warframe","type":"Warframe","description":"Nidus draws strength from the Infestation. It bolsters him with survivability as he deals high damage and provides crowd control. Plague your enemies.","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Nidus","imageUrl":"https://cdn.warframestat.us/img/Nidus.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["madurai","vazarin"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"If Nidus is killed with at least |STACKS| stacks of Mutation, those |STACKS| stacks are consumed; this grants |DURATION|s of invulnerability and restores Health to |HEAL|%."},{"name":"Nokko","baseFamily":"Nokko","category":"Warframe","type":"Warframe","description":"Spring into action with Nokko! With his strong roots and an array of tricky fungi this young defender will quickly grow on you","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Nokko","imageUrl":"https://cdn.warframestat.us/img/Nokko.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["madurai","naramon"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"Upon receiving fatal damage, Nokko reverts to his Sprodling form and his active mushrooms will glow, reviving Nokko when touched. Orbs spawned will grant a speed boost but not healing. If a glowing mushroom is not reached in time, Nokko will automatically use a self-revive."},{"name":"Nova","baseFamily":"Nova","category":"Warframe","type":"Warframe","description":"Harness antimatter. Nova uses antiparticles to provide crowd control and amplify damage output. She obliterates enemies by destabilizing matter itself.","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Nova","imageUrl":"https://cdn.warframestat.us/img/Nova.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["madurai","madurai"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"Enemies killed while slowed down have |CHANCE|% to drop health orbs. Enemies killed while sped up have |CHANCE|% to drop energy orbs."},{"name":"Nyx","baseFamily":"Nyx","category":"Warframe","type":"Warframe","description":"Psychic attacks make Nyx a dangerous foe. She reaches into enemy consciousness to provide crowd control and turn their attacks back on them. Such manipulation can turn the tide of battle.","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Nyx","imageUrl":"https://cdn.warframestat.us/img/Nyx.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["madurai","naramon"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"Nyx gains +|CRITICAL|% Critical Chance on Primary and Secondary weapons per Confused enemy within <AFFINITY_SHARE>Affinity Range, up to +|MAX|%."},{"name":"Oberon","baseFamily":"Oberon","category":"Warframe","type":"Warframe","description":"Healing and suffering do Oberon’s bidding. His command of the natural world supports allies. Boon to his friends, bane of his foes.","masteryReq":0,"wikiUrl":"https://wiki.warframe.com/w/Oberon","imageUrl":"https://cdn.warframestat.us/img/Oberon.png","isPrime":false,"isIncarnon":false,"isKuva":false,"isTenet":false,"polarities":["madurai","madurai"],"damage":0,"critChance":0,"critMultiplier":0,"statusChance":0,"passive":"Oberon gr
